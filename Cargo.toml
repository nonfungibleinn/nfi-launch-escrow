[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
# Size over speed: the program account is a rent deposit of twice the binary, so every byte costs SOL up front.
opt-level = "z"

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
