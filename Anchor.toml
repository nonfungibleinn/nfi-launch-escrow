[toolchain]
anchor_version = "0.31.1"
solana_version = "4.2.2"

[features]
resolution = true
skip-lint = false

[programs.localnet]
nfi_launch_escrow = "3qRS59TJmgaNUzKjKsUe3XGggodSXA9GHU9Q5u2ffE1n"

[programs.devnet]
nfi_launch_escrow = "3qRS59TJmgaNUzKjKsUe3XGggodSXA9GHU9Q5u2ffE1n"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "NODE_OPTIONS=--no-experimental-strip-types yarn run ts-mocha -p ./tsconfig.json -t 1000000 ${TEST_FILES:-tests/**/*.ts}"

[test]
startup_wait = 60000

[[test.genesis]]
address = "3qRS59TJmgaNUzKjKsUe3XGggodSXA9GHU9Q5u2ffE1n"
program = "target/deploy/nfi_launch_escrow.so"
upgradeable = true

# MPL Core, dumped from mainnet (the same fixture nfi_raffle uses), for the burn on refund.
[[test.genesis]]
address = "CoREENxT6tW1HoK8ypY1SxRMZTcVPm7R94rH4PZNhX7d"
program = "tests/fixtures/mpl_core.so"

[test.validator]
bind_address = "127.0.0.1"
